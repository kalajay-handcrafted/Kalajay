<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalajay ERP login</title><style>[hidden]{display:none!important}body{background:#fbf7e8;color:#40291c;font:16px system-ui}main{max-width:480px;margin:8vh auto;padding:28px}form,label{display:grid;gap:12px}input,select,button{font:inherit;padding:12px;border:1px solid #c6b491;border-radius:6px}button{background:#a9482a;color:white}a{color:#a9482a}</style><main><a href="/erp/">Kalajay ERP</a><h1 id="title">Sign in</h1><p id="intro"></p><form><label>Username<input name="username" autocomplete="username" required maxlength="80"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="role-label" hidden>Access<select name="role"><option value="manager">Manager — view only</option><option value="admin">Admin — full access</option></select></label><button id="save">Sign in</button></form><p id="status" role="status"></p><section id="users"></section></main><script>
const mode=location.pathname.endsWith('/setup')?'setup':location.pathname.endsWith('/accounts')?'users':'login';const f=document.querySelector('form'),status=document.querySelector('#status');
if(mode!=='login'){document.querySelector('#title').textContent=mode==='setup'?'Set up your admin account':'Create ERP account';document.querySelector('#save').textContent='Create account';f.elements.password.minLength=12;f.elements.password.autocomplete='new-password';document.querySelector('#intro').textContent='Use a unique password of at least 12 characters.';document.querySelector('#role-label').hidden=mode!=='users';}
async function list(){const r=await fetch('/api/auth/users');if(!r.ok)return;const data=await r.json();const section=document.querySelector('#users');section.replaceChildren();for(const u of data){const p=document.createElement('p');p.textContent=u.username+' — '+u.role;section.append(p);}}
f.addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#save');b.disabled=true;try{const data=Object.fromEntries(new FormData(f));if(mode==='setup')data.token=location.hash.slice(1);const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'Request failed.');if(mode==='login')location.href='/erp/';else if(mode==='setup'){history.replaceState(null,'','/erp/login');location.href='/erp/login';}else{f.reset();status.textContent='Account created.';list();}}catch(e){status.textContent=e.message;}finally{b.disabled=false;}});if(mode==='users')list();
</script></html>
