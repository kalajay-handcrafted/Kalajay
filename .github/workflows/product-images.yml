name: Product image checks
on:
  pull_request:
    paths:
      - 'Final/product_images.py'
      - 'Final/test_product_images.py'
      - 'Final/erp/index.html'
      - 'Final/backend.py'
      - 'Final/requirements.txt'
      - '.github/workflows/product-images.yml'
permissions:
  contents: read
jobs:
  product-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install application dependencies
        run: python3 -m pip install -r Final/requirements.txt
      - name: Test uploads, shared product references and persistence
        working-directory: Final
        run: python3 -m unittest -v test_product_images
